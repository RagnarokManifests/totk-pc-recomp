name: Sync with upstream

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream valentderah/totk-pc-recomp
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh repo sync "$GITHUB_REPOSITORY" --source valentderah/totk-pc-recomp --branch main
